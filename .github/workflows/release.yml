name: Release
# 仅在推送 teamflow-v* 标签时打包并创建 GitHub Release；日常验证在本地按 profile 运行。
on:
  push:
    tags: ['teamflow-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 核对标签与版本
        run: |
          version=$(cat .agents/teamflow-core/references/VERSION)
          [ "$RELEASE_TAG" = "teamflow-v$version" ] || { echo "Release 标签必须与 VERSION 一致"; exit 1; }
      - name: 打包
        run: python3 scripts/package_release.py
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
