name: 原生日志组件验证
on:
  push:
    paths:
      - '.agents/skills/ios-team-flow/assets/logging/**'
      - '.agents/skills/ios-team-flow/scripts/install_logging.py'
      - 'scripts/check_logging.py'
      - '.github/workflows/teamflow-logging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_logging.py
