name: 工作流工具校验
on:
  push:
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - '.gitignore'
      - 'README.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 按改动检查规范与工具行为
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/run_workflow_checks.py --base "$BASE_SHA"
      - name: 验证可分发压缩包
        run: python3 scripts/package_release.py
