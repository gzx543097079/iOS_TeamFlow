name: 工作流 Release 压缩包
on:
  push:
    tags:
      - 'teamflow-v*'
permissions:
  contents: read
jobs:
  native-logging:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_logging.py
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 核对标签与版本
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = Path('.agents/skills/ios-team-flow/references/VERSION').read_text().strip()
          if os.environ['RELEASE_TAG'] != 'teamflow-v' + version:
              raise SystemExit('Release 标签必须与 .agents/skills/ios-team-flow/references/VERSION 一致')
          PY
      - name: 验证并打包
        run: |
          python3 scripts/run_workflow_checks.py
          python3 scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: teamflow-release-assets
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [native-logging, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: teamflow-release-assets
          path: dist
      - name: 验证通过后创建公开 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
